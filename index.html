<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official Creator Portal for Doggy69YT. Watch the latest YouTube videos and blog breakdowns.">
    <title>Doggy69YT | Official Creator Portal</title>
    <style>
        :root {
            --bg-deep: #05070a;
            --bg-surface: #0f1420;
            --bg-card: #151b2b;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .announcement-bar {
            background: linear-gradient(90deg, #ff2a5f, #ff7043);
            color: white;
            text-align: center;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .announcement-bar a { color: #fff; text-decoration: underline; margin-left: 8px; }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .brand-name { font-size: 1.3rem; font-weight: 800; color: var(--text-primary); }
        .brand-name span { color: var(--accent); }

        .hero {
            padding: 80px 8% 40px 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero h1 { font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 900; margin-bottom: 20px; }
        .hero h1 span { background: linear-gradient(135deg, var(--accent), #ff9800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.15rem; color: var(--text-secondary); max-width: 600px; }

        .suggestions-section {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 8%;
        }

        .section-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .section-subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 25px; }

        #searchInput {
            width: 100%;
            padding: 15px;
            margin-bottom: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .suggestion-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .suggestion-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .suggestion-card h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
        .suggestion-card p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; }
        .suggestion-link { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.9rem; }

        footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 40px 8%;
            text-align: center;
            color: var(--text-secondary);
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <div class="announcement-bar">
        ⚡ NEW VIDEO OUT NOW! <a href="video-1.html">Watch & Download &rarr;</a>
    </div>

    <header>
        <a href="index.html" class="brand">
            <img src="https://yt3.googleusercontent.com/XRFscfHwCIgMUGuuabq-YHu4_bEd8XFdkuVm2Jv4fHw7Gyryx2z0zxeFumEW7RSBbHM5gbwdlg=s160-c-k-c0x00ffffff-no-rj" alt="Logo" class="brand-logo-img">
            <div class="brand-name">DOGGY<span>69YT</span></div>
        </a>
        <a href="https://www.youtube.com/@doggy69ff" target="_blank" style="background-color: var(--accent); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">YouTube Channel</a>
    </header>

    <section class="hero">
        <h1>Welcome to <span>Doggy69YT</span></h1>
        <p>Catch the latest gameplay uploads and configuration guides.</p>
    </section>

    <section class="suggestions-section">
        <h2 class="section-title">Latest Video Breakdowns</h2>
        <p class="section-subtitle">Search through your favorite gameplay guides and configs.</p>
        
        <input type="text" id="searchInput" onkeyup="filterVideos()" placeholder="Search videos by title or keyword...">

        <div class="suggestions-grid" id="videoGrid">
            <!-- Dynamically populated from videos.json -->
        </div>
    </section>

    <script>
        let allVideos = [];

        async function loadVideos() {
            try {
                let response = await fetch('videos.json');
                allVideos = await response.json();
                renderCards(allVideos);
            } catch (error) {
                console.error('Error loading videos:', error);
            }
        }

        function renderCards(videos) {
            let grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            videos.forEach(video => {
                let card = document.createElement('div');
                card.className = 'suggestion-card';
                card.innerHTML = `
                    <div>
                        <h3>${video.title}</h3>
                        <p>${video.description}</p>
                    </div>
                    <a href="${video.url}" class="suggestion-link">Watch & Download &rarr;</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterVideos() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allVideos.filter(v => v.title.toLowerCase().includes(query) || v.description.toLowerCase().includes(query));
            renderCards(filtered);
        }

        loadVideos();
    </script>

    <footer>
        <p>&copy; 2026 Doggy69YT. All Rights Reserved.</p>
    </footer>

</body>
</html>
