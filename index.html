<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggy69YT | Creator Portal</title>
    <style>
        :root { --bg: #05070a; --card: #0f1420; --accent: #ff2a5f; --text: #ffffff; --muted: #94a3b8; --border: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        header { padding: 20px 8%; background: rgba(5,7,10,0.9); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.2rem; font-weight: 800; color: white; text-decoration: none; }
        .brand span { color: var(--accent); }
        .hero { padding: 60px 8% 30px; text-align: center; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero h1 span { color: var(--accent); }
        .hero p { color: var(--muted); }
        .main { max-width: 900px; margin: 20px auto 60px; padding: 0 8%; }
        #search { width: 100%; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 30px; outline: none; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { font-size: 1.2rem; margin-bottom: 10px; text-transform: capitalize; }
        .card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
        .card a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.9rem; }
        .loading { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 20px; }
        footer { text-align: center; padding: 40px; color: var(--muted); border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">DOGGY<span>69YT</span></a>
        <a href="https://www.youtube.com/@doggy69ff" target="_blank" style="background: var(--accent); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem;">YouTube</a>
    </header>

    <section class="hero">
        <h1>Welcome to <span>Doggy69YT</span></h1>
        <p>All configurations, tools, and guides auto-loaded below.</p>
    </section>

    <div class="main">
        <!-- Search Bar -->
        <input type="text" id="search" onkeyup="filterPages()" placeholder="Search guides and setups...">
        
        <!-- Auto-Generated Cards Grid -->
        <div class="grid" id="grid">
            <div class="loading">Scanning for web pages...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Doggy69YT</p>
    </footer>

    <!-- Universal Auto-Discovery Script -->
    <script>
        const GITHUB_USER = "nadianafish5-max";
        const REPO_NAME = "website";

        let allPages = [];

        async function fetchPages() {
            const grid = document.getElementById('grid');
            try {
                let response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`);
                let files = await response.json();

                // Filters out non-HTML files, index, templates, and hidden files
                let htmlFiles = files.filter(file => 
                    file.name.endsWith('.html') && 
                    file.name !== 'index.html' && 
                    file.name !== 'video-template.html'
                );

                if (htmlFiles.length === 0) {
                    grid.innerHTML = '<div class="loading">No guide pages found yet. Upload an HTML file!</div>';
                    return;
                }

                allPages = htmlFiles.map(file => {
                    let cleanTitle = file.name.replace('.html', '').replace(/-/g, ' ');
                    return {
                        title: cleanTitle,
                        url: file.name,
                        description: `Click to view the complete guide and files for ${cleanTitle}.`
                    };
                });

                displayPages(allPages);
            } catch (err) {
                console.error("Error loading repository files:", err);
                grid.innerHTML = '<div class="loading">Could not auto-load pages. Check your connection or API limit.</div>';
            }
        }

        function displayPages(pages) {
            let grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            pages.forEach(page => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <h3>${page.title}</h3>
                        <p>${page.description}</p>
                    </div>
                    <a href="${page.url}">View Guide &rarr;</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterPages() {
            let query = document.getElementById('search').value.toLowerCase();
            let filtered = allPages.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
            displayPages(filtered);
        }

        fetchPages();
    </script>

    <!-- Monetag Ad Script -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="271787" async data-cfasync="false"></script>

</body>
</html>
