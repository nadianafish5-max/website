<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch the video breakdown and download configuration files for Doggy69YT.">
    <title>Video Breakdown | Doggy69YT</title>
    <style>
        :root {
            --bg-deep: #05070a;
            --bg-surface: #0f1420;
            --bg-card: #151b2b;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .brand-name span { color: var(--accent); }

        .content-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 8%;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 15px; }
        p { color: var(--text-secondary); margin-bottom: 30px; font-size: 1.05rem; }

        .download-btn {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.2s ease;
        }

        .download-btn:hover { transform: translateY(-2px); }

        footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 40px 8%;
            text-align: center;
            color: var(--text-secondary);
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <img src="https://yt3.googleusercontent.com/XRFscfHwCIgMUGuuabq-YHu4_bEd8XFdkuVm2Jv4fHw7Gyryx2z0zxeFumEW7RSBbHM5gbwdlg=s160-c-k-c0x00ffffff-no-rj" alt="Logo" class="brand-logo-img">
            <div class="brand-name">DOGGY<span>69YT</span></div>
        </a>
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 600;">&larr; Back to Home</a>
    </header>

    <div class="content-container">
        <h1>Your Video Title Here</h1>
        <p>Detailed blog notes, tips, and setup walkthrough go here.</p>

        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen></iframe>
        </div>

        <div style="margin-top: 40px;">
            <a href="YOUR_DOWNLOAD_LINK" target="_blank" class="download-btn">Download Files &rarr;</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Doggy69YT. All Rights Reserved.</p>
    </footer>

</body>
</html>
